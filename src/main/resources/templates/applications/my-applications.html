<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Applications</title>
    <link rel="stylesheet" href="/css/list.css">
</head>

<body>

<h1>Мои заявки аренды</h1>

<hr>

<div class="table-container">
    <table>

        <tr>
            <th>ID</th>
            <th>Помещение</th>
            <th>Комментарий</th>
            <th>Статус</th>
            <th>Время взаимодействия</th>
            <th>Действия</th>
        </tr>

        <tr th:each="app : ${applications}">
            <td th:text="${app.id}"></td>
            <td th:text="${app.officeSpace.number}"></td>
            <td th:text="${app.comment != null && !#strings.isEmpty(app.comment) ? app.comment : 'Нет комментария'}"></td>
            <td th:text="${app.status.name() == 'PENDING'} ? 'В ожидании' : (${app.status.name() == 'APPROVED'} ? 'Одобрено' :
                         (${app.status.name() == 'REJECTED'} ? 'Отклонено' : app.status))"></td>
            <td th:text="${app.createdAt}"></td>
            <td>

                <form
                        th:if="${app.officeSpace.status.name() == 'OCCUPIED'}"
                        th:action="@{/applications/release/{id}(id=${app.officeSpace.id})}"
                        method="post">

                    <button type="submit">Освободить помещение</button>

                </form>
            </td>
        </tr>
    </table>

</div>
</body>
</html>
