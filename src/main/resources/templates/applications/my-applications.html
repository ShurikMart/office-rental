<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>My Applications</title>
</head>

<body>

<h1>My Rental Applications</h1>

<hr>

<table border="1">

    <tr>

        <th>ID</th>
        <th>Office</th>
        <th>Status</th>
        <th>Created</th>
        <th>Actions</th>

    </tr>

    <tr th:each="app : ${applications}">

        <td th:text="${app.id}"></td>

        <td th:text="${app.officeSpace.number}"></td>

        <td th:text="${app.status}"></td>

        <td th:text="${app.createdAt}"></td>

        <td>

            <form
                    th:if="${app.officeSpace.status.name() == 'OCCUPIED'}"
                    th:action="@{/applications/release/{id}(id=${app.officeSpace.id})}"
                    method="post">

                <button type="submit">
                    Release Office
                </button>

            </form>

        </td>

    </tr>

</table>

</body>
</html>
