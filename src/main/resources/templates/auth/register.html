<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register</title>
</head>

<body>

<h1>Register</h1>

<form
        th:action="@{/register}"
        th:object="${user}"
        method="post">

    <div>

        <input
                type="text"
                th:field="*{username}"
                placeholder="Username">

    </div>

    <br>

    <div>

        <input
                type="email"
                th:field="*{email}"
                placeholder="Email">

    </div>

    <br>

    <div>

        <input
                type="password"
                th:field="*{password}"
                placeholder="Password">

    </div>

    <br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
