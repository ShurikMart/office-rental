<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login</title>
</head>

<body>

<h1>Login</h1>

<form method="post" action="/login">

    <div>
        <input
                type="text"
                name="username"
                placeholder="Username">
    </div>

    <br>

    <div>
        <input
                type="password"
                name="password"
                placeholder="Password">
    </div>

    <br>

    <button type="submit">
        Login
    </button>

</form>

<br>

<a href="/register">
    Register
</a>

</body>
</html>
