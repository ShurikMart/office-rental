<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Floor Plan</title>
    <link rel="stylesheet" href="/css/floor-plan.css">
</head>

<body>

<div class="profile-sidebar">
    <a href="/profile" class="profile-link">Профиль</a>
</div>

<h1 style="text-align:center;">Схема помещений</h1>

<div class="filters-sidebar">
    <button type="button" class="filters-toggle-btn" id="filters-toggle-btn">Использовать фильтры</button>

    <div class="filters-panel" id="filters-panel">
        <form method="get" action="/floor-plan" class="filters-form">

            <h3>Фильтры</h3>

            <label>Статус:</label>
            <select name="status">
                <option value="" th:selected="${param.status == null || param.status[0] == ''}">Все</option>
                <option value="FREE" th:selected="${param.status != null && param.status[0] == 'FREE'}">Свободно</option>
                <option value="OCCUPIED" th:selected="${param.status != null && param.status[0] == 'OCCUPIED'}">Занято</option>
            </select>

            <label>Этаж:</label>
            <input type="number" name="floor" placeholder="Этаж"
                   th:value="${param.floor != null ? param.floor[0] : ''}">

            <label>Мин. площадь:</label>
            <input type="number" name="minArea" placeholder="Мин. площадь"
                   th:value="${param.minArea != null ? param.minArea[0] : ''}">

            <label>Макс. площадь:</label>
            <input type="number" name="maxArea" placeholder="Макс. площадь"
                   th:value="${param.maxArea != null ? param.maxArea[0] : ''}">

            <label>Мин. вместимость:</label>
            <input type="number" name="minCapacity" placeholder="Мин. вместимость"
                   th:value="${param.minCapacity != null ? param.minCapacity[0] : ''}">

            <label>Тип помещения:</label>
            <select name="officeType">
                <option value="" th:selected="${param.officeType == null || param.officeType[0] == ''}">Любой</option>
                <option value="STANDARD" th:selected="${param.officeType != null && param.officeType[0] == 'STANDARD'}">Открытый офис</option>
                <option value="MEETING_ROOM" th:selected="${param.officeType != null && param.officeType[0] == 'MEETING_ROOM'}">Переговорная</option>
                <option value="REST_ZONE" th:selected="${param.officeType != null && param.officeType[0] == 'REST_ZONE'}">Зона отдыха</option>
                <option value="SERVER_ROOM" th:selected="${param.officeType != null && param.officeType[0] == 'SERVER_ROOM'}">Серверная</option>
                <option value="WAREHOUSE" th:selected="${param.officeType != null && param.officeType[0] == 'WAREHOUSE'}">Склад</option>
            </select>

            <label>Фурнитура:</label>
            <select name="hasFurniture">
                <option value="" th:selected="${param.hasFurniture == null || param.hasFurniture[0] == ''}">Фурнитура</option>
                <option value="true" th:selected="${param.hasFurniture != null && param.hasFurniture[0] == 'true'}">Да</option>
                <option value="false" th:selected="${param.hasFurniture != null && param.hasFurniture[0] == 'false'}">Нет</option>
            </select>

            <label>Мин. цена:</label>
            <input type="number" name="minPrice"
                   th:value="${param.minPrice != null ? param.minPrice[0] : ''}">

            <label>Макс. цена:</label>
            <input type="number" name="maxPrice"
                   th:value="${param.maxPrice != null ? param.maxPrice[0] : ''}">

            <div class="filters-actions">
                <button type="submit">Применить</button>
                <a href="/floor-plan">Сбросить</a>
            </div>
        </form>
    </div>
</div>

<div class="plan-container"
     style="background-image:url('/images/floor1.png');">

    <div
            th:each="plan : ${floorPlans}"
            class="office-box"
            th:classappend="${plan.officeSpace.status.name() == 'OCCUPIED'} ? ' occupied-office' : ''"
            th:if="${plan.officeSpace != null}"
            th:data-id="${plan.officeSpace.id}"
            th:data-number="${plan.officeSpace.number}"
            th:data-area="${plan.officeSpace.area}"
            th:data-price="${plan.officeSpace.rentalPrice}"
            th:data-floor="${plan.officeSpace.floor}"
            th:data-type="${plan.officeSpace.officeType}"
            th:data-status="${plan.officeSpace.status}"
            th:style="
                'left:' + ${plan.x} + 'px;' +
                'top:' + ${plan.y} + 'px;' +
                'width:' + ${plan.width} + 'px;' +
                'height:' + ${plan.height} + 'px;'"
            th:onclick="${plan.officeSpace.status.name() == 'FREE' or isAdmin} ? 'showOfficeInfo(this, event)' : null"
    >

        <div class="office-label" th:text="${plan.officeSpace.number}"></div>
    </div>
</div>

<div class="info-panel" onclick="event.stopPropagation()">
    <h3>Параметры помещения</h3>

    <p><b>Номер:</b> <span id="office-number">-</span></p>
    <p><b>Площадь:</b> <span id="office-area">-</span></p>
    <p><b>Цена:</b> <span id="office-price">-</span></p>
    <p><b>Этаж:</b> <span id="office-floor">-</span></p>
    <p><b>Тип:</b> <span id="office-type">-</span></p>

    <hr>

    <div th:if="${isUser}">
        <form method="post" action="/applications/create">
            <input type="hidden" id="office-id-input" name="officeId">
            <textarea name="comment" placeholder="Комментарий"></textarea>
            <br><br>
            <button type="submit">Подать заявку</button>
        </form>
    </div>

    <p th:if="${!isAdmin and !isUser}">Пожалуйста, войдите, чтоб подать заявку.</p>
</div>

<script src="/js/floor-plan.js"></script>

</body>
</html>
