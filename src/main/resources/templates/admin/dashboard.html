<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"

        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<h1>Инструментарий админа</h1>

<div class="dashboard-section">
    <h3>Статистика по помещениям</h3>

    <div class="stats-grid">
        <div class="stat-card">
            <p><b>Всего помещений:</b></p>
            <span class="stat-value" th:text="${totalOffices}"></span>
        </div>

        <div class="stat-card">
            <p><b>Свободных помещений:</b></p>
            <span class="stat-value" th:text="${freeOffices}"></span>
        </div>

        <div class="stat-card">
            <p><b>Занятых офисов:</b></p>
            <span class="stat-value" th:text="${occupiedOffices}"></span>
        </div>
    </div>
</div>

<div class="dashboard-section">
    <h3>Навигация</h3>
    <ul>
        <li><a href="/admin/floor-editor">Редактор схемы</a></li>
        <li><a href="/floor-plan">Схема помещений</a></li>
        <li><a href="/profile">Профиль пользователя</a></li>
        <li><a href="/admin/applications">Управление заявками</a></li>
    </ul>
</div>

<div class="dashboard-section">
    <h3>Отчет по приложению</h3>

    <div class="stats-grid">
        <div class="stat-card">
            <p><b>В обработке:</b></p>
            <span class="stat-value" th:text="${pendingApplications}"></span>
        </div>

        <div class="stat-card">
            <p><b>Одобрено:</b></p>
            <span class="stat-value" th:text="${approvedApplications}"></span>
        </div>

        <div class="stat-card">
            <p><b>Отклонено:</b></p>
            <span class="stat-value" th:text="${rejectedApplications}"></span>
        </div>
    </div>
</div>

<form method="post" action="/logout">
    <button type="submit">Выйти</button>
</form>

</body>
</html>
