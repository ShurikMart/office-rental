<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Floor Editor</title>
    <link rel="stylesheet" href="/css/floor-editor.css">
</head>

<body>

<div class="profile-sidebar">
    <a href="/profile" class="profile-link">Профиль</a>
</div>

<h1 class="page-title">Редактор схемы помещений</h1>

<div class="editor-layout">

    <div class="editor-sidebar">

        <div class="toolbar">
            <button type="button" class="toolbar-btn" onclick="setMode('draw')">Рисовать</button>
            <button type="button" class="toolbar-btn" onclick="setMode('edit')">Редактировать</button>
            <button type="button" class="toolbar-btn danger-btn" onclick="setMode('delete')">Удалить</button>
        </div>


        <div id="draw-toolbar" class="mode-panel">

            <h3>Создание помещения</h3>

            <select id="new-building">
                <option th:each="building : ${buildings}"
                        th:value="${building.id}"
                        th:text="${building.name}">
                </option>
            </select>

            <input type="text" id="new-number" placeholder="Номер офиса">
            <input type="number" id="new-area" placeholder="Площадь">
            <input type="number" id="new-floor" placeholder="Этаж">
            <input type="number" id="new-capacity" placeholder="Вместимость">
            <input type="number" id="new-price" placeholder="Цена">

            <select id="new-type">
                <option value="STANDARD">Открытый офис</option>
                <option value="MEETING_ROOM">Переговорная</option>
                <option value="REST_ZONE">Зона отдыха</option>
                <option value="SERVER_ROOM">Серверная</option>
                <option value="WAREHOUSE">Склад</option>
            </select>

            <label>Наличие фурнитуры
                <input type="checkbox" id="new-furniture">
            </label>

            <select id="new-status">
                <option value="FREE">Свободно</option>
                <option value="OCCUPIED">Занято</option>
            </select>

            <button type="button" class="toolbar-btn action-btn" onclick="createOffice()">Создать помещение</button>

            <h3>Место помещения на плане</h3>

            <select id="office-select">
                <option value="">Выбрать офис</option>
                <option th:each="office : ${offices}"
                        th:value="${office.id}"
                        th:text="${office.number}">
                </option>
            </select>

            <button type="button" class="toolbar-btn action-btn" onclick="saveSelection()">Сохранить расположение</button>

        </div>


        <div id="edit-toolbar" class="mode-panel" style="display:none;">

            <h3>Редактировать помещение</h3>

            <input type="hidden" id="edit-office-id">
            <input type="text" id="edit-number" placeholder="Номер">
            <input type="number" id="edit-area" placeholder="Площадь">
            <input type="number" id="edit-floor" placeholder="Этаж">
            <input type="number" id="edit-capacity" placeholder="Вместимость">
            <input type="number" id="edit-price" placeholder="Цена">

            <select id="edit-type">
                <option value="STANDARD">Открытый офис</option>
                <option value="MEETING_ROOM">Переговорная</option>
                <option value="REST_ZONE">Зона отдыха</option>
                <option value="SERVER_ROOM">Серверная</option>
                <option value="WAREHOUSE">Склад</option>
            </select>

            <label>Наличие фурнитуры
                <input type="checkbox" id="edit-furniture">
            </label>

            <select id="edit-status">
                <option value="FREE">Свободно</option>
                <option value="OCCUPIED">Занято</option>
            </select>

            <button type="button" class="toolbar-btn action-btn" onclick="updateOffice()">Сохранить изменения</button>
            <button type="button" class="toolbar-btn danger-btn" onclick="deleteOffice()">Удалить помещение</button>

        </div>

        <div id="save-status"></div>

    </div>

    <div class="plan-shell">

        <div class="plan-container" id="plan-container" style="background-image:url('/images/floor1.png');">

            <div th:each="plan : ${floorPlans}"
                 class="office-box"
                 th:data-id="${plan.officeSpace.id}"
                 th:style="
                    'left:' + ${plan.x} + 'px;' +
                    'top:' + ${plan.y} + 'px;' +
                    'width:' + ${plan.width} + 'px;' +
                    'height:' + ${plan.height} + 'px;'"
                 th:onclick="'onOfficeClick(this, event)'">

                <div class="office-label" th:text="${plan.officeSpace.number}">

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/js/floor-editor.js"></script>

</body>
</html>
