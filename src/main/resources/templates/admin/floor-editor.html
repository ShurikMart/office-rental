<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Floor Editor</title>

    <link rel="stylesheet" href="/css/floor-plan.css">

</head>

<body>

<h1>Floor Plan Editor</h1>

<div class="toolbar">
    <button onclick="setMode('draw')">Draw</button>
    <button onclick="setMode('edit')">Edit</button>
    <button onclick="setMode('delete')">Delete</button>
</div>

<div id="edit-panel" style="display:none;">
    <h3>Edit Office</h3>

    <input type="hidden" id="edit-office-id">

    <input type="text" id="edit-number" placeholder="Number">
    <input type="number" id="edit-area" placeholder="Area">
    <input type="number" id="edit-floor" placeholder="Floor">
    <input type="number" id="edit-capacity" placeholder="Capacity">
    <input type="text" id="edit-type" placeholder="Office type">

    <label>
        <input type="checkbox" id="edit-furniture">
        Has furniture
    </label>

    <input type="number" id="edit-price" placeholder="Price">

    <select id="edit-status">
        <option value="FREE">FREE</option>
        <option value="OCCUPIED">OCCUPIED</option>
    </select>

    <button onclick="updateOffice()">Save changes</button>
    <button onclick="deleteOffice()">Delete</button>
</div>

<div class="toolbar">

    <label>Office:</label>

    <select id="office-select">

        <option
                th:each="office : ${offices}"
                th:value="${office.id}"
                th:text="${office.number}">
        </option>

    </select>

    <button onclick="saveSelection()">
        Save
    </button>

</div>

<hr>

<h3>Create Office</h3>

<div class="toolbar">

    <select id="new-building">
        <option th:each="building : ${buildings}"
                th:value="${building.id}"
                th:text="${building.name}">
        </option>
    </select>

    <input type="text" id="new-number" placeholder="Office number">
    <input type="number" id="new-area" placeholder="Area">
    <input type="number" id="new-floor" placeholder="Floor">
    <input type="number" id="new-capacity" placeholder="Capacity">
    <input type="text" id="new-type" placeholder="Office type">

    <label style="margin-left:10px;">
        <input type="checkbox" id="new-furniture">
        Has furniture
    </label>

    <input type="number" id="new-price" placeholder="Price">

    <select id="new-status">
        <option value="FREE">FREE</option>
        <option value="OCCUPIED">OCCUPIED</option>
    </select>

    <button onclick="createOffice()">Create Office</button>
</div>
<div id="save-status"></div>

<div
        class="plan-container"
        id="plan-container"

        style="
            background-image:
            url('/images/floor1.png');
        ">

    <div
            th:each="plan : ${floorPlans}"
            class="office-box"
            th:data-id="${plan.officeSpace.id}"
            th:style="
            'left:' + ${plan.x} + 'px;' +
            'top:' + ${plan.y} + 'px;' +
            'width:' + ${plan.width} + 'px;' +
            'height:' + ${plan.height} + 'px;'
        "
            th:onclick="'onOfficeClick(this, event)'">

        <div class="office-label"
             th:text="${plan.officeSpace.number}">
        </div>

    </div>

</div>

<script src="/js/floor-editor.js"></script>

</body>
</html>
